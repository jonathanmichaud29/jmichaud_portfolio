services:
    postgres:
        image: postgres:16-bookworm
        env_file: .env
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
            - ./infra/postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - backend

